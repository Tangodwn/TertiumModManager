name: Windows CI

on:
  push:
    branches: ["main"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q


  build-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build Windows application smoke test
        run: python -m PyInstaller --noconfirm --clean TertiumModManager.spec
      - name: Verify application output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/TertiumModManager/TertiumModManager.exe")) {
            throw "PyInstaller did not produce TertiumModManager.exe."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer smoke test
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "/DMyAppVersion=$version" "installer\TertiumModManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup smoke build failed." }

      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "release/TertiumModManager-Setup-x64.exe")) {
            throw "Inno Setup did not produce TertiumModManager-Setup-x64.exe."
          }
