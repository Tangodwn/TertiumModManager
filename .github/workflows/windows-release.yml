name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $expected = "v$version"
            if ("${{ github.ref_name }}" -ne $expected) {
              throw "Release tag '${{ github.ref_name }}' does not match VERSION '$version'. Expected '$expected'."
            }
          }

      - name: Install test/build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer-only release
        shell: pwsh
        run: ./scripts/build_windows_release.ps1 -InstallerOnly -SkipTests

      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "release/TertiumModManager-Setup-x64.exe")) { throw "Installer missing." }
          if (-not (Test-Path "release/TertiumModManager-Setup-x64.exe.sha256")) { throw "Installer checksum missing." }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TertiumModManager-Windows-${{ github.ref_name }}
          path: |
            release/TertiumModManager-Setup-x64.exe
            release/TertiumModManager-Setup-x64.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "RELEASE_NOTES_$((Get-Content VERSION -Raw).Trim()).md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "release/TertiumModManager-Setup-x64.exe" "release/TertiumModManager-Setup-x64.exe.sha256" --clobber
          } else {
            if (Test-Path $notes) {
              gh release create $tag "release/TertiumModManager-Setup-x64.exe" "release/TertiumModManager-Setup-x64.exe.sha256" --title "Tertium Mod Manager $tag" --notes-file $notes
            } else {
              gh release create $tag "release/TertiumModManager-Setup-x64.exe" "release/TertiumModManager-Setup-x64.exe.sha256" --title "Tertium Mod Manager $tag" --generate-notes
            }
          }
